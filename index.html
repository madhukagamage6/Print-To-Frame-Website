<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print to Frame</title>
    <meta property="og:title" content="Print to Frame" />
    <meta property="og:description" content="Precision-engineered structural solutions for large-format display systems." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" />
    <script>
      if (typeof window !== 'undefined' && window.fetch) {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return originalFetch;
          },
          set() {
            console.warn('Prevented attempt to overwrite window.fetch');
          }
        });
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
